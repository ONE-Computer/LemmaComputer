model_list: []
# OpenAI, Anthropic, GLM, and Bedrock routes are tenant-scoped LiteLLM
# database records created by Control's Provider settings. Provider API keys
# are never supplied through deployment environment variables or static YAML.

mcp_servers:
  lemmacomputer_ms365:
    transport: http
    url: http://ms365-mcp:3000/mcp
    mcp_info:
      lemmacomputer_egress_profile: internal
    description: Governed Outlook Mail, Calendar, OneDrive, SharePoint, and Teams connector
    auth_type: oauth2
    oauth2_flow: authorization_code
    client_id: lemmacomputer-litellm
    authorization_url: os.environ/LEMMACOMPUTER_M365_AUTHORIZATION_URL
    token_url: http://ms365-mcp:3000/token
    scopes:
      - User.Read
      - offline_access
      - Mail.ReadWrite
      - Mail.Send
      - Calendars.ReadWrite
      - Files.ReadWrite
      - Sites.Selected
      - Chat.Read
      - ChatMessage.Read
      - ChatMessage.Send
      - Team.ReadBasic.All
      - Channel.ReadBasic.All
      - ChannelMessage.Read.All
      - ChannelMessage.Send
    allowed_tools:
      - get-current-user
      - list-mail-folders
      - list-mail-messages
      - get-mail-message
      - create-draft-email
      - update-mail-message
      - delete-mail-message
      - move-mail-message
      - send-mail
      - send-draft-message
      - reply-mail-message
      - reply-all-mail-message
      - forward-mail-message
      - list-calendars
      - list-calendar-events
      - get-calendar-view
      - get-calendar-event
      - create-calendar-event
      - update-calendar-event
      - delete-calendar-event
      - list-drives
      - get-drive-root-item
      - list-folder-files
      - search-onedrive-files
      - get-drive-item
      - download-bytes
      - get-sharepoint-site-by-path
      - get-sharepoint-site
      - list-sharepoint-site-drives
      - create-onedrive-folder
      - upload-file-content
      # Internal execution-only primitive. Workspace grants never expose this
      # tool directly; Control assigns it only to an approved exact-operation
      # key for resumable uploads.
      - create-upload-session
      - move-rename-onedrive-item
      - copy-drive-item
      - delete-onedrive-file
      - list-chats
      - list-chat-messages
      - list-joined-teams
      - list-team-channels
      - list-channel-messages
      - send-chat-message
      - reply-to-chat-message
      - send-channel-message
      - reply-to-channel-message
    allow_all_keys: false
    available_on_public_internet: false
    delegate_auth_to_upstream: false
  lemmacomputer_github:
    alias: github
    transport: http
    url: https://api.githubcopilot.com/mcp/
    description: Official GitHub remote MCP connector managed through LiteLLM
    auth_type: oauth2
    oauth2_flow: authorization_code
    client_id: os.environ/GITHUB_MCP_CLIENT_ID
    client_secret: os.environ/GITHUB_MCP_CLIENT_SECRET
    scopes:
      - repo
      - read:org
      - read:user
      - user:email
    available_on_public_internet: true
  # Google Workspace remote MCP servers require a separately registered
  # Google OAuth client. Keep it distinct from social sign-in so scopes,
  # redirect URIs, consent, and rotation can be reviewed independently.
  lemmacomputer_gmail:
    transport: http
    url: https://gmailmcp.googleapis.com/mcp/v1
    description: Official Google Workspace Gmail remote MCP connector
    auth_type: oauth2
    oauth2_flow: authorization_code
    # Google issues a refresh token only when the authorization request carries
    # access_type=offline, and only on a first consent unless prompt=consent is
    # also sent. Neither is a scope, so declaring offline_access the way the
    # Microsoft 365 server does has no effect here, and LiteLLM sends no such
    # parameter of its own. Without this the connection holds a one-hour access
    # token with nothing to renew from, and every person reconnects hourly.
    # authorize_with_server merges parameters already present on this URL before
    # adding its own, and token_url and scopes are still discovered.
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
    client_id: os.environ/GOOGLE_WORKSPACE_MCP_CLIENT_ID
    client_secret: os.environ/GOOGLE_WORKSPACE_MCP_CLIENT_SECRET
    available_on_public_internet: true
  lemmacomputer_google_drive:
    transport: http
    url: https://drivemcp.googleapis.com/mcp/v1
    description: Official Google Workspace Drive remote MCP connector
    auth_type: oauth2
    oauth2_flow: authorization_code
    # Offline access, as explained on the Gmail server above.
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
    client_id: os.environ/GOOGLE_WORKSPACE_MCP_CLIENT_ID
    client_secret: os.environ/GOOGLE_WORKSPACE_MCP_CLIENT_SECRET
    available_on_public_internet: true
  lemmacomputer_google_calendar:
    transport: http
    url: https://calendarmcp.googleapis.com/mcp/v1
    description: Official Google Workspace Calendar remote MCP connector
    auth_type: oauth2
    oauth2_flow: authorization_code
    # Offline access, as explained on the Gmail server above.
    authorization_url: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
    client_id: os.environ/GOOGLE_WORKSPACE_MCP_CLIENT_ID
    client_secret: os.environ/GOOGLE_WORKSPACE_MCP_CLIENT_SECRET
    available_on_public_internet: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  callbacks: lemmacomputer_policy_callback.proxy_handler_instance
  drop_params: true
  set_verbose: false
  turn_off_message_logging: true
  log_raw_request_response: false

# Routes fail closed. There is intentionally no cross-provider fallback.
