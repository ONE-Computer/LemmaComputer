name: ${ONECOMPUTER_PROVIDER_QUALIFICATION_PROJECT:?set an isolated qualification project name}

services:
  litellm-postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${ONECOMPUTER_PROVIDER_QUALIFICATION_LITELLM_POSTGRES_PASSWORD:?set an isolated LiteLLM database password}
    networks:
      - provider-qualification
    volumes:
      - provider-qualification-litellm-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    restart: "no"

  control-postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: onecomputer
      POSTGRES_USER: onecomputer
      POSTGRES_PASSWORD: ${ONECOMPUTER_PROVIDER_QUALIFICATION_CONTROL_POSTGRES_PASSWORD:?set an isolated Control database password}
    networks:
      - provider-qualification
    volumes:
      - provider-qualification-control-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${ONECOMPUTER_PROVIDER_QUALIFICATION_CONTROL_POSTGRES_PORT:?set an isolated Control database port}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecomputer -d onecomputer"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    restart: "no"

  gateway-fixture:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["npm", "run", "start", "--workspace", "@onecomputer/gateway-fixture"]
    environment:
      FIXTURE_HOST: 0.0.0.0
      FIXTURE_PORT: "4200"
    networks:
      provider-qualification:
    ports:
      - "127.0.0.1:${ONECOMPUTER_PROVIDER_QUALIFICATION_FIXTURE_PORT:?set an isolated fixture port}:4200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:v1.93.0@sha256:a1745e629abfb17d434426ff48b115f54f4f4c4a0f5af241de569e93c63c411e
    command:
      - --config
      - /app/provider-qualification.yaml
      - --port
      - "4000"
      - --num_workers
      - "1"
    environment:
      LITELLM_MASTER_KEY: ${ONECOMPUTER_PROVIDER_QUALIFICATION_MASTER_KEY:?set an isolated LiteLLM master key}
      LITELLM_SALT_KEY: ${ONECOMPUTER_PROVIDER_QUALIFICATION_SALT_KEY:?set an isolated LiteLLM salt key}
      DATABASE_URL: postgres://litellm:${ONECOMPUTER_PROVIDER_QUALIFICATION_LITELLM_POSTGRES_PASSWORD}@litellm-postgres:5432/litellm
      # Provider routes remain real OpenAI-style routes, but the qualification
      # points the pinned LiteLLM image at the local fixture rather than an
      # external provider.
      OPENAI_API_BASE: http://gateway-fixture:4200/v1
      DISABLE_ADMIN_UI: "true"
      PROXY_BASE_URL: http://127.0.0.1:${ONECOMPUTER_PROVIDER_QUALIFICATION_LITELLM_PORT}
    networks:
      - provider-qualification
    ports:
      - "127.0.0.1:${ONECOMPUTER_PROVIDER_QUALIFICATION_LITELLM_PORT:?set an isolated LiteLLM port}:4000"
    volumes:
      - ./config/litellm/provider-qualification.yaml:/app/provider-qualification.yaml:ro
    depends_on:
      litellm-postgres:
        condition: service_healthy
      gateway-fixture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  provider-qualification:
    internal: false

volumes:
  provider-qualification-litellm-data:
  provider-qualification-control-data:
