services:
  control-api:
    environment:
      # Dedicated ONEComputer loopback bridge. Keep this independent from
      # unrelated local application development ports.
      M365_AUTHORIZATION_ORIGIN: http://localhost:4311

  litellm:
    environment:
      ONECOMPUTER_MCP_POLICY_URL: http://control-api:4100/internal/v1/mcp/authorize
      ONECOMPUTER_MCP_POLICY_TOKEN: ${ONECOMPUTER_CONTROLLER_TOKEN:?set ONECOMPUTER_CONTROLLER_TOKEN}
    volumes:
      - ../issue-008/litellm-config.yaml:/app/config.yaml:ro
      - ../issue-008/onecomputer_policy_callback.py:/app/onecomputer_policy_callback.py:ro
    depends_on:
      ms365-mcp: { condition: service_healthy }

  web:
    environment:
      VITE_LITELLM_ADMIN_URL: http://localhost:4000/ui

  ms365-mcp:
    container_name: onecomputer-ms365-mcp
    image: onecomputer/softeria-ms365-mcp:0.131.2
    build:
      context: ../issue-008/softeria
      dockerfile: Dockerfile
    command:
      - --http
      - "0.0.0.0:3000"
      - --org-mode
      - --enabled-tools
      - ^(list-mail-folders|list-mail-messages|get-mail-message|create-draft-email|update-mail-message|delete-mail-message|move-mail-message|send-mail|send-draft-message|reply-mail-message|reply-all-mail-message|forward-mail-message|list-calendars|list-calendar-events|get-calendar-view|get-calendar-event|create-calendar-event|update-calendar-event|delete-calendar-event|list-drives|get-drive-root-item|list-folder-files|search-onedrive-files|get-drive-item|create-onedrive-folder|upload-file-content|create-upload-session|move-rename-onedrive-item|copy-drive-item|delete-onedrive-file|list-chats|list-chat-messages|list-joined-teams|list-team-channels|list-channel-messages|send-chat-message|reply-to-chat-message|send-channel-message|reply-to-channel-message)$
      - --allowed-scopes
      - User.Read offline_access Mail.ReadWrite Mail.Send Calendars.ReadWrite Files.ReadWrite Chat.Read ChatMessage.Read ChatMessage.Send Team.ReadBasic.All Channel.ReadBasic.All ChannelMessage.Read.All ChannelMessage.Send
      - --no-dynamic-registration
      - --allow-unauthenticated-discovery
    environment:
      # These public identifiers must be replaced with the dedicated
      # ONEComputer Entra app before interactive OAuth can succeed.
      MS365_MCP_CLIENT_ID: ${ONECOMPUTER_MS365_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      MS365_MCP_TENANT_ID: ${ONECOMPUTER_MS365_TENANT_ID:-organizations}
      MS365_MCP_CLIENT_SECRET: ${ONECOMPUTER_MS365_CLIENT_SECRET:-}
      MS365_MCP_PUBLIC_URL: http://localhost:4311
      MS365_MCP_ALLOWED_REDIRECT_URIS: http://localhost:4000/callback
      MS365_MCP_MAX_TOP: "25"
      MS365_MCP_MAX_PAGES: "4"
      MS365_MCP_MAX_ITEMS: "100"
      MS365_MCP_REDACT_PII: "true"
      MS365_MCP_REQUIRE_CONFIRM: "true"
      MS365_MCP_TRUST_PROXY_HOPS: "0"
      LOG_LEVEL: info
    networks: [gateway-private, ms365-egress]
    # Local OAuth browser bridge only. Remove when an authenticated production
    # reverse-proxy route supplies the public authorization endpoint.
    ports: ["127.0.0.1:4311:3000"]
    read_only: true
    tmpfs:
      - /tmp
      - /home/node/.ms-365-mcp-server:uid=1000,gid=1000,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(async r=>{if(!r.ok||!(await r.text()).includes('Microsoft 365 MCP Server'))process.exit(1)}).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

networks:
  ms365-egress: {}
