name: ${LEMMACOMPUTER_COMPOSE_PROJECT_NAME:?set LEMMACOMPUTER_COMPOSE_PROJECT_NAME in .env}

x-control-runtime: &control-runtime
  image: ${LEMMACOMPUTER_CONTROL_RUNTIME_IMAGE:?set LEMMACOMPUTER_CONTROL_RUNTIME_IMAGE in .env}
  build:
    context: .
    dockerfile: docker/Dockerfile.node
  init: true

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    env_file:
      - path: .runtime-env/postgres.env
        format: raw
    networks:
      - control-private
    volumes:
      - control-data:/var/lib/postgresql
      - ./infra/postgres/init-auth-database.sh:/docker-entrypoint-initdb.d/20-auth-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmacomputer -d lemmacomputer"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  litellm-postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    env_file:
      - path: .runtime-env/litellm-postgres.env
        format: raw
    networks:
      - gateway-private
    volumes:
      - gateway-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 3s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ms365-mcp:
    image: ${LEMMACOMPUTER_MS365_MCP_IMAGE:?set LEMMACOMPUTER_MS365_MCP_IMAGE in .env}
    build:
      context: .
      dockerfile: docker/Dockerfile.ms365-mcp
    command:
      - --http
      - 0.0.0.0:3000
      - --org-mode
      - --enabled-tools
      - ^(get-current-user|list-mail-folders|list-mail-messages|get-mail-message|create-draft-email|update-mail-message|delete-mail-message|move-mail-message|send-mail|send-draft-message|reply-mail-message|reply-all-mail-message|forward-mail-message|list-calendars|list-calendar-events|get-calendar-view|get-calendar-event|create-calendar-event|update-calendar-event|delete-calendar-event|list-drives|get-drive-root-item|list-folder-files|search-onedrive-files|get-drive-item|get-sharepoint-site-by-path|get-sharepoint-site|list-sharepoint-site-drives|create-onedrive-folder|upload-file-content|create-upload-session|move-rename-onedrive-item|copy-drive-item|delete-onedrive-file|list-chats|list-chat-messages|list-joined-teams|list-team-channels|list-channel-messages|send-chat-message|reply-to-chat-message|send-channel-message|reply-to-channel-message)$
      - --allowed-scopes
      - User.Read offline_access Mail.ReadWrite Mail.Send Calendars.ReadWrite Files.ReadWrite Sites.Selected Chat.Read ChatMessage.Read ChatMessage.Send Team.ReadBasic.All Channel.ReadBasic.All ChannelMessage.Read.All ChannelMessage.Send
      - --no-dynamic-registration
      - --allow-unauthenticated-discovery
    env_file:
      - path: .runtime-env/ms365-mcp.env
        format: raw
    networks:
      - gateway-private
      - microsoft-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /home/node/.ms-365-mcp-server:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(async r=>{if(!r.ok||!(await r.text()).includes('Microsoft 365 MCP Server'))process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  litellm:
    container_name: ${LEMMACOMPUTER_LITELLM_CONTAINER:?set LEMMACOMPUTER_LITELLM_CONTAINER in .env}
    image: lemmacomputer/litellm:v1.93.0-lemmacomputer-egress
    build:
      context: .
      dockerfile: docker/Dockerfile.litellm
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
      - --num_workers
      - "2"
      - --log_config
      - /app/logging.yaml
    env_file:
      - path: .runtime-env/litellm.env
        format: raw
    environment:
      # OpenAI rejects function tools plus reasoning effort on legacy Chat
      # Completions. Enable pinned LiteLLM's built-in OpenAI-only Responses
      # bridge before workers import the LiteLLM module.
      LITELLM_ROUTE_ALL_CHAT_OPENAI_TO_RESPONSES: "true"
    networks:
      - gateway-private
      - mcp-client-private
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
      - ./config/litellm/logging.yaml:/app/logging.yaml:ro
      - ./integrations/litellm/lemmacomputer_policy_callback.py:/app/lemmacomputer_policy_callback.py:ro
    depends_on:
      litellm-postgres:
        condition: service_healthy
      ms365-mcp:
        condition: service_healthy
      gateway-egress-proxy:
        condition: service_healthy
      remote-mcp-egress-proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket,urllib.request; socket.create_connection(('gateway-egress-proxy',3128),2).close(); socket.create_connection(('remote-mcp-egress-proxy',3128),2).close(); urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # The model-only internet-routed hop for LiteLLM. It has a static provider
  # policy and intentionally cannot use the custom-MCP Control callback.
  gateway-egress-proxy:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["npm", "run", "start", "--workspace", "@lemmacomputer/egress-proxy"]
    env_file:
      - path: .runtime-env/gateway-egress-proxy.env
        format: raw
    networks:
      gateway-private:
        aliases:
          - gateway-egress-proxy
      model-egress: {}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('node:net').connect(3128,'127.0.0.1').once('connect',()=>process.exit(0)).once('error',()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The only external path for custom/public MCP operations. LiteLLM's pinned
  # strict client selects this proxy explicitly with trust_env disabled, so a
  # redirect cannot use NO_PROXY to reach Control or the private M365 service.
  remote-mcp-egress-proxy:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["npm", "run", "start", "--workspace", "@lemmacomputer/egress-proxy"]
    env_file:
      - path: .runtime-env/remote-mcp-egress-proxy.env
        format: raw
    networks:
      mcp-client-private:
        aliases:
          - remote-mcp-egress-proxy
      mcp-egress-private: {}
      model-egress: {}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('node:net').connect(3128,'127.0.0.1').once('connect',()=>process.exit(0)).once('error',()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Control uses this dedicated listener for every LiteLLM administration call.
  # In the hosted profile it terminates mTLS and only accepts the Control
  # workload certificate; it never receives workspace traffic directly.
  litellm-admin-proxy:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["node", "apps/litellm-admin-proxy/server.mjs"]
    # This alias exists only on litellm-admin-private, so the listener is
    # not bound to the gateway-private interface used by workspaces.
    env_file:
      - path: .runtime-env/litellm-admin-proxy.env
        format: raw
    networks:
      gateway-private: {}
      litellm-admin-private:
        aliases:
          - litellm-admin-listener
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('node:net').connect(Number(process.env.LITELLM_ADMIN_PROXY_PORT),'litellm-admin-listener').once('connect',()=>process.exit(0)).once('error',()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  openvtc-consent:
    build:
      context: .
      dockerfile: docker/Dockerfile.openvtc-consent
    image: ${LEMMACOMPUTER_OPENVTC_CONSENT_IMAGE:?set LEMMACOMPUTER_OPENVTC_CONSENT_IMAGE in .env}
    env_file:
      - path: .runtime-env/openvtc-consent.env
        format: raw
    networks:
      - consent-private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8788/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  workspace-controller:
    <<: [*control-runtime, *hardened]
    command: ["npm", "run", "start", "--workspace", "@lemmacomputer/workspace-controller"]
    env_file:
      - path: .runtime-env/workspace-controller.env
        format: raw
    networks:
      - control-private
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('node:net');const socket=net.connect(4101,'127.0.0.1');socket.once('connect',()=>{socket.end();process.exit(0)});socket.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000).unref()
      interval: 5s
      timeout: 3s
      retries: 20

  db-migrate:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    env_file:
      - path: .runtime-env/db-migrate.env
        format: raw
    networks:
      - control-private
    depends_on:
      postgres:
        condition: service_healthy

  auth-db-migrate:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["npm", "run", "auth:db:migrate"]
    restart: "no"
    env_file:
      - path: .runtime-env/auth-db-migrate.env
        format: raw
    networks:
      - control-private
    depends_on:
      postgres:
        condition: service_healthy

  platform-auth-db-init:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    command: ["/opt/lemmacomputer/ensure-platform-auth-database.sh"]
    restart: "no"
    env_file:
      - path: .runtime-env/platform-auth-db-init.env
        format: raw
    networks:
      - control-private
    volumes:
      - ./infra/postgres/ensure-platform-auth-database.sh:/opt/lemmacomputer/ensure-platform-auth-database.sh:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy

  platform-auth-db-migrate:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["npm", "run", "auth:db:migrate"]
    restart: "no"
    env_file:
      - path: .runtime-env/platform-auth-db-migrate.env
        format: raw
    networks:
      - control-private
    depends_on:
      platform-auth-db-init:
        condition: service_completed_successfully

  artifact-data-init:
    <<: [*control-runtime, *hardened]
    user: root
    entrypoint: ["sh", "-ec"]
    command:
      - |
        chown node:node /var/lib/lemmacomputer/artifacts
        chmod 0700 /var/lib/lemmacomputer/artifacts
    network_mode: none
    cap_add:
      - CHOWN
      - FOWNER
    restart: "no"
    volumes:
      - artifact-data:/var/lib/lemmacomputer/artifacts

  control-api:
    <<: [*control-runtime, *hardened]
    container_name: ${LEMMACOMPUTER_CONTROL_CONTAINER:?set LEMMACOMPUTER_CONTROL_CONTAINER in .env}
    user: node
    command: ["npm", "run", "start", "--workspace", "@lemmacomputer/control-api"]
    env_file:
      - path: .runtime-env/control-api.env
        format: raw
    volumes:
      - artifact-data:/var/lib/lemmacomputer/artifacts
    networks:
      - web-edge
      - control-private
      - consent-private
      - gateway-private
      - litellm-admin-private
      - mcp-egress-private
      - identity-egress
    depends_on:
      artifact-data-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      auth-db-migrate:
        condition: service_completed_successfully
      platform-auth-db-migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      litellm-admin-proxy:
        condition: service_healthy
      openvtc-consent:
        condition: service_healthy
      workspace-controller:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4100/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  channel-broker:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["npm", "run", "start", "--workspace", "@lemmacomputer/channel-broker"]
    env_file:
      - path: .runtime-env/channel-broker.env
        format: raw
    networks:
      - control-private
      - web-edge
      - channel-egress
    depends_on:
      postgres:
        condition: service_healthy
      control-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4102/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  scheduler-worker:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["npm", "run", "start", "--workspace", "@lemmacomputer/scheduler-worker"]
    env_file:
      - path: .runtime-env/scheduler-worker.env
        format: raw
    networks:
      - control-private
    depends_on:
      postgres:
        condition: service_healthy
      control-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4103/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["node", "apps/web/server.mjs"]
    env_file:
      - path: .runtime-env/web.env
        format: raw
    networks:
      - web-edge
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  workspace-ingress:
    <<: [*control-runtime, *hardened]
    user: node
    command: ["npm", "run", "start", "--workspace", "@lemmacomputer/workspace-ingress-server"]
    env_file:
      - path: .runtime-env/workspace-ingress.env
        format: raw
    networks:
      - public-edge
      - web-edge
      - control-private
      - gateway-private
    ports:
      - "${LEMMACOMPUTER_HTTP_BIND_ADDRESS:?set LEMMACOMPUTER_HTTP_BIND_ADDRESS in .env}:${LEMMACOMPUTER_WEB_PORT:?set LEMMACOMPUTER_WEB_PORT in .env}:4174"
    depends_on:
      web:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ms365-mcp:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4174/__lemmacomputer/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  # This is a build target, not a long-running service. The controller creates
  # workspace containers from the resulting image through the Docker API.
  workspace-image:
    profiles:
      - build
    image: ${LEMMACOMPUTER_WORKSPACE_IMAGE:?set LEMMACOMPUTER_WORKSPACE_IMAGE in .env}
    build:
      context: .
      dockerfile: docker/Dockerfile.workspace
    entrypoint: ["/bin/true"]

networks:
  public-edge: {}
  web-edge:
    internal: true
  control-private:
    name: ${LEMMACOMPUTER_CONTROL_NETWORK:?set LEMMACOMPUTER_CONTROL_NETWORK in .env}
    internal: true
  consent-private:
    internal: true
  gateway-private:
    internal: true
  # LiteLLM can reach the strict remote-MCP proxy on this private hop without
  # gaining a direct route to the public model-egress network.
  mcp-client-private:
    internal: true
  # Only the remote-MCP proxy and Control meet on this network. It prevents
  # that proxy from dialing other gateway-private services directly.
  mcp-egress-private:
    internal: true
  # The only intended consumer of the hosted admin listener is Control. The
  # proxy additionally verifies Control's dedicated client certificate.
  litellm-admin-private:
    internal: true
  identity-egress: {}
  model-egress: {}
  microsoft-egress: {}
  channel-egress: {}

volumes:
  control-data:
  gateway-data:
  artifact-data:
